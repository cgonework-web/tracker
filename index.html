<title>Daily Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: sporty, quick, encouraging; one-handed phone tool, logging in seconds
   IDEA: wrist-style activity rings plus a habit line, each habit its own transit colour
   PICTURE: today's concentric rings (steps, workout, swim) with the cigarette count in the core
   COLOUR and TYPE: white / night #0e1116; blue steps, red workout, cyan swim, amber smoke ember; Figtree
   LAYOUT: single centred column, big 44px+ targets, sticky bottom tab bar with safe-area padding */
:root{--bg:#fff;--card:#f2f4f7;--ink:#0e1116;--mut:#5b6470;--line:#e2e6eb;--steps:#0a5cff;--work:#e6261f;--swim:#0096bd;--smoke:#e09a00;--ok:#00a05a;--bar:rgba(255,255,255,.86);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--card:#181c23;--ink:#eef1f4;--mut:#9aa3ad;--line:#272d36;--steps:#4d8bff;--work:#ff5147;--swim:#22c3ea;--smoke:#ffc233;--ok:#2fc47a;--bar:rgba(14,17,22,.86);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1116;--card:#181c23;--ink:#eef1f4;--mut:#9aa3ad;--line:#272d36;--steps:#4d8bff;--work:#ff5147;--swim:#22c3ea;--smoke:#ffc233;--ok:#2fc47a;--bar:rgba(14,17,22,.86);color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,sans-serif;overflow-x:clip}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1,h2,h3{margin:0;line-height:1.1}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--steps);outline-offset:2px}
.mut{color:var(--mut)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand em{font-style:normal;font-weight:600;font-size:12.5px;color:var(--mut);flex-basis:100%;padding-left:16px;margin-top:-2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.ok{background:var(--ok)}.dot.err{background:var(--work)}
.datenav{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
.datenav h1{font-size:32px;font-weight:800;letter-spacing:-.02em}
.dlabel{position:relative;flex:1}
.dlabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.35}
.pill{border:0;background:var(--ink);color:var(--bg);border-radius:99px;padding:0 14px;height:36px;font-weight:700;font-size:14px}
.hero{display:flex;align-items:center;gap:18px;background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px}
.hero svg{width:min(44vw,180px);height:auto;flex:none}
.arc{transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.legend{flex:1;display:grid;gap:10px}
.lg{display:grid;grid-template-columns:6px 1fr;gap:10px;align-items:stretch}
.lg i{border-radius:3px;background:var(--c)}
.lg b{display:block;font-size:17px;font-weight:800;white-space:nowrap}
.lg span{font-size:13px;color:var(--mut)}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ch h2{font-size:18px;font-weight:800;flex:1}
.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.ic svg{width:20px;height:20px}
.ch .val{font-weight:800;font-size:18px;white-space:nowrap}
.toggle{width:100%;min-height:56px;border-radius:16px;border:2px dashed var(--line);background:var(--bg);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.toggle.on{border:2px solid var(--work);background:var(--work);color:#fff}
.row{display:flex;gap:8px}
.inp{flex:1;height:50px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 14px;font-size:20px;font-weight:700;width:100%}
.inp:focus{border-color:var(--steps);outline:0}
.btn{height:50px;border-radius:14px;border:0;padding:0 18px;font-weight:800;font-size:16px;background:var(--ink);color:var(--bg);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{height:40px;padding:0 14px;border-radius:12px;border:0;background:var(--bg);font-weight:700;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.x{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--swim) 14%,var(--bg));box-shadow:none}
.meter{height:10px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .6s}
.note{font-size:14px;color:var(--mut);margin:8px 0 0}
.smoke{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
.plus{min-height:96px;border-radius:20px;border:0;background:var(--smoke);color:#1a1200;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.plus small{font-size:13px;font-weight:600;opacity:.8;margin-top:4px}
.plus:active,.chip:active,.toggle:active,.btn:active{transform:scale(.97)}
.side{display:grid;gap:8px;grid-template-rows:1fr 1fr;width:96px}
.side .count{background:var(--bg);border-radius:16px;display:grid;place-items:center;text-align:center;line-height:1}
.side .count b{font-size:30px;font-weight:800}
.side .count span{font-size:12px;color:var(--mut)}
.side button{border:0;border-radius:16px;background:var(--bg);font-weight:700;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line)}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.times span{font-size:13px;font-weight:600;padding:4px 9px;border-radius:8px;background:color-mix(in srgb,var(--smoke) 18%,var(--bg));white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{height:40px;border:0;border-radius:11px;background:transparent;font-weight:700}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.pnav h2{flex:1;text-align:center;font-size:22px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:18px;padding:14px;display:grid;gap:2px}
.kpi .kl{font-size:13px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kl i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.kpi b{font-size:clamp(22px,7vw,28px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.kd{font-size:12.5px;font-weight:700;color:var(--mut)}
.kd.good{color:var(--ok)}.kd.bad{color:var(--work)}
.streaks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.streak{border-radius:18px;padding:14px;color:#fff;background:var(--c)}
.streak b{display:block;font-size:24px;font-weight:800;white-space:nowrap}
.streak span{font-size:13px;opacity:.9;font-weight:600}
.streak.sm{color:#1a1200}
.fig{position:relative;height:170px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font-family:Figtree,system-ui,sans-serif}
.card h3{font-size:16px;font-weight:800;margin-bottom:2px}
.card .sub{font-size:13px;color:var(--mut);margin:0 0 10px}
.grid{display:grid;gap:3px;align-items:center}
.grid .rl{font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap;padding-right:6px}
.grid .c{display:block;aspect-ratio:1;max-height:24px;border-radius:4px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.grid .c.on{background:var(--c)}
.grid .c.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.grid .dl{font-size:11px;color:var(--mut);text-align:center;font-weight:600}
.ins{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ins li{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mut);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:10px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr.go{cursor:pointer}
.yes{color:var(--work);font-weight:800}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:15px}
.field .inp{font-size:18px}
textarea.inp{height:96px;padding:12px;font-size:14px;font-weight:500;resize:vertical}
.danger{background:var(--work);color:#fff}
.ghost{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.steps-list{margin:0;padding-left:20px;display:grid;gap:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center;z-index:5}
.tabs div{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
.tabs button{border:0;background:none;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut)}
.tabs button.on{color:var(--ink)}
.tabs svg{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:14px;padding:0 6px 0 16px;height:48px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;transition:.25s;z-index:6;white-space:nowrap;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--steps);font-weight:800;height:40px;padding:0 10px;filter:brightness(1.4)}
.empty{text-align:center;padding:24px 12px;color:var(--mut)}
@media (max-width:360px){.hero{flex-direction:column}.hero svg{width:200px}.side{width:84px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Sections"><div>
<button data-act="tab" data-v="today" id="t-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>Today</button>
<button data-act="tab" data-v="progress" id="t-progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>Progress</button>
<button data-act="tab" data-v="setup" id="t-setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</div></nav>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button data-act="undo" id="tundo">Undo</button></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='dailytracker.v1';
const DEFS={stepGoal:10000,swimGoal:30,cigPrice:20,cigLimit:0,su:0,erasedAt:0};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const IC={
 work:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>',
 steps:'<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="8" cy="8" rx="3" ry="4.6"/><ellipse cx="16" cy="13" rx="3" ry="4.6"/><rect x="5.6" y="13.6" width="4.8" height="3" rx="1.5"/><rect x="13.6" y="18.6" width="4.8" height="3" rx="1.5"/></svg>',
 swim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="6.5" r="2"/><path d="M4 12l5-4 4 3.5M2 16.5c2.5 0 2.5-1.5 5-1.5s2.5 1.5 5 1.5 2.5-1.5 5-1.5 2.5 1.5 5 1.5M2 20.5c2.5 0 2.5-1.5 5-1.5s2.5 1.5 5 1.5 2.5-1.5 5-1.5 2.5 1.5 5 1.5"/></svg>',
 smoke:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="2" y="14" width="16" height="4" rx="1"/><path d="M14 14v4M21 14v4M21 4c0 2.5-2 2.5-2 5M17.5 6c0 2-1.5 2.4-1.5 4.5"/></svg>'
};
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayK=()=>dk(new Date());
const blank=()=>({w:0,steps:0,swim:[],cigs:[],u:0});
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const kfmt=v=>v>=1000?(v/1000).toFixed(v>=10000||v%1000===0?0:1)+'k':String(Math.round(v*10)/10);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const tstr=m=>{const h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+':'+pad(mm)+(h<12?' am':' pm')};
const shortD=d=>d.getDate()+' '+MON[d.getMonth()];
const clean=r=>({w:r&&r.w?1:0,steps:Math.max(0,Math.round(+r.steps||0)),swim:Array.isArray(r.swim)?r.swim.map(Number).filter(n=>n>0&&n<=600):[],cigs:Array.isArray(r.cigs)?r.cigs.map(Number).filter(n=>Number.isFinite(n)&&n>=-1&&n<1440):[],u:+r.u||0});

let S={settings:{...DEFS},days:{}};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.days){for(const k in r.days)S.days[k]=clean(r.days[k]);S.settings={...DEFS,...r.settings}}}catch(e){}
const day=k=>S.days[k]||blank();
const has=k=>!!S.days[k];
let tab='today',cur=todayK(),period='week',pOff=0,undo=null,syncState='sync',eraseArm=false;

/* ---------- persistence + sync ---------- */
const dirty=new Set();let dirtySet=false,col=null,flushing=false,timer=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function queue(ms){if(col)setSync('saving');clearTimeout(timer);timer=setTimeout(flush,ms||400)}
addEventListener('pagehide',()=>{clearTimeout(timer);flush()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(timer);flush()}});
async function flush(){
 if(!col||flushing)return;flushing=true;
 try{
  if(dirtySet){dirtySet=false;try{await col.doc('settings').set({...S.settings})}catch(e){dirtySet=true;throw e}}
  for(const m of [...dirty]){const days={};for(const k in S.days)if(k.startsWith(m))days[k]=S.days[k];await col.doc('m'+m).set({days});dirty.delete(m)}
  setSync('ok');
 }catch(e){setSync('err');flushing=false;queue(15000);return}
 flushing=false;if(dirty.size||dirtySet)queue();
}
async function pull(){
 if(!col)return;
 let done=false;const t=setTimeout(()=>{if(!done)setSync('err')},10000);
 try{
  const snap=await col.get();done=true;clearTimeout(t);
  const docs=[...snap.docs].sort((a,b)=>(a.id==='settings'?-1:0)-(b.id==='settings'?-1:0));
  let changed=false;const seen=new Set();
  for(const doc of docs){
   const v=doc.data()||{};
   if(doc.id==='settings'){
    const rs=+v.su||0,ls=+S.settings.su||0;
    if(rs>ls){const n={...DEFS};for(const k in DEFS)if(Number.isFinite(+v[k]))n[k]=+v[k];
     if(n.erasedAt>(+S.settings.erasedAt||0)){for(const k in S.days)if((S.days[k].u||0)<n.erasedAt)delete S.days[k]}
     S.settings=n;changed=true}
    else if(ls>rs)dirtySet=true;
   }else if(/^m\d{4}-\d\d$/.test(doc.id)&&v.days&&typeof v.days==='object'){
    const m=doc.id.slice(1);seen.add(m);
    for(const k in v.days){
     if(!/^\d{4}-\d\d-\d\d$/.test(k)||!k.startsWith(m)||!v.days[k])continue;
     const r=clean(v.days[k]);if(r.u<(+S.settings.erasedAt||0))continue;
     const l=S.days[k];
     if(!l||r.u>l.u){S.days[k]=r;changed=true}else if(l.u>r.u)dirty.add(m);
    }
    for(const k in S.days)if(k.startsWith(m)&&!(k in v.days))dirty.add(m);
   }
  }
  for(const k in S.days){const m=k.slice(0,7);if(!seen.has(m))dirty.add(m)}
  if(!docs.some(d=>d.id==='settings')&&S.settings.su)dirtySet=true;
  if(changed){persist();render()}
  setSync('ok');if(dirty.size||dirtySet)queue(300);
 }catch(e){done=true;clearTimeout(t);setSync('err')}
}
function setSync(s){syncState=s;const d=$('#sdot');if(d){d.className='dot '+(s==='ok'||s==='local'?'ok':s==='err'?'err':'');d.title=syncText()}const st=$('#stext');if(st)st.textContent=syncText()}
function syncText(){return syncState==='ok'?'Saved to your Claude account':syncState==='saving'?'Saving…':syncState==='err'?'Not saved yet — check internet, will retry':syncState==='local'?'Saved on this phone':'Connecting…'}
setSync('local');try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(tab==='today'&&cur<todayK()&&lastToday!==todayK()){cur=todayK()}lastToday=todayK();render();pull()});
let lastToday=todayK();

/* ---------- edits ---------- */
function edit(k,fn,msg){
 const had=has(k),prev=had?JSON.parse(JSON.stringify(S.days[k])):null;
 const d=JSON.parse(JSON.stringify(day(k)));fn(d);d.u=Date.now();S.days[k]=d;
 persist();dirty.add(k.slice(0,7));queue();undo={k,prev};render();toast(msg,true);
}
function doUndo(){if(!undo)return;const d=undo.prev?{...undo.prev}:blank();d.u=Date.now();S.days[undo.k]=d;persist();dirty.add(undo.k.slice(0,7));queue();undo=null;render();toast('Undone',false)}
let tT=null;
function toast(msg,canUndo){$('#tmsg').textContent=msg;$('#tundo').style.display=canUndo?'':'none';const t=$('#toast');t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),3200)}
function saveSteps(){const el=$('#stepsIn');if(!el)return;const n=parseInt(String(el.value).replace(/\D/g,''),10)||0;if(n===day(cur).steps)return;if(n>200000){toast('That looks too high',false);return}edit(cur,d=>{d.steps=n},fmt(n)+' steps saved')}
function setSetting(key,val){S.settings[key]=val;S.settings.su=Date.now();dirtySet=true;persist();queue();toast('Saved',false)}

/* ---------- charts ---------- */
const figs=new Map();const ro=new ResizeObserver(es=>{for(const e of es){const f=figs.get(e.target);if(f)f()}});
function chart(id,vals,labels,o){
 const el=document.getElementById(id);if(!el)return;
 const draw=()=>{
  const W=el.clientWidth,H=el.clientHeight;if(!W)return;
  const pl=34,pr=4,pt=16,pb=22,iw=W-pl-pr,ih=H-pt-pb,n=vals.length;
  let mx=Math.max(o.goal||0,...vals.map(v=>v||0),o.min||1);
  const mag=Math.pow(10,Math.floor(Math.log10(mx)));mx=Math.ceil(mx/mag*2)/2*mag;
  const y=v=>pt+ih-v/mx*ih,bw=iw/n,gap=Math.max(1.5,bw*(n>20?.2:.3));
  let s='';
  [0,mx/2,mx].forEach(t=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="11" style="fill:var(--mut)">${kfmt(t)}</text>`});
  vals.forEach((v,i)=>{
   const x=pl+i*bw+gap/2,w=Math.max(1,bw-gap);
   if(o.future&&o.future[i]){s+=`<rect x="${x}" y="${pt+ih-3}" width="${w}" height="3" rx="1.5" style="fill:var(--line)"/>`;return}
   if(v>0){const h=Math.max(3,v/mx*ih),hit=o.goal&&o.goodAbove&&v>=o.goal;s+=`<rect x="${x}" y="${pt+ih-h}" width="${w}" height="${h}" rx="${Math.min(5,w/2)}" style="fill:${o.color}" ${hit||!o.goal||!o.goodAbove?'':'opacity=".55"'}/>`;
    if(n<=8&&W>=300)s+=`<text x="${x+w/2}" y="${pt+ih-h-4}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--ink)">${kfmt(v)}</text>`}
   if(o.show(i,W))s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="11" style="fill:var(--mut)">${esc(labels[i])}</text>`;
  });
  if(o.goal)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(o.goal)}" y2="${y(o.goal)}" style="stroke:var(--ink)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55"/><text x="${W-pr}" y="${y(o.goal)-4}" text-anchor="end" font-size="11" font-weight="700" style="fill:var(--ink)">${esc(o.goalLabel||'goal')}</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${s}</svg>`;
 };
 figs.set(el,draw);ro.observe(el);draw();
}

/* ---------- stats ---------- */
function stats(keys){
 const t=todayK(),el=keys.filter(k=>k<=t),lg=el.filter(has),st=S.settings;
 const sd=el.filter(k=>day(k).steps>0),stepsTot=sum(sd.map(k=>day(k).steps));
 const cigs=sum(lg.map(k=>day(k).cigs.length));
 return{el,lg,work:el.filter(k=>day(k).w).length,stepsTot,stepsAvg:sd.length?stepsTot/sd.length:0,stepDays:sd.length,goalHit:sd.filter(k=>day(k).steps>=st.stepGoal).length,
  swimMin:sum(el.map(k=>sum(day(k).swim))),swimSes:sum(el.map(k=>day(k).swim.length)),cigs,cigAvg:lg.length?cigs/lg.length:0,sf:lg.filter(k=>!day(k).cigs.length).length,spent:cigs*st.cigPrice};
}
function range(){
 const t=new Date();t.setHours(0,0,0,0);let start,n,label,pstart,pn;
 if(period==='week'){const dow=(t.getDay()+6)%7;start=addDays(t,-dow+7*pOff);n=7;pstart=addDays(start,-7);pn=7;const end=addDays(start,6);label=pOff===0?'This week':pOff===-1?'Last week':shortD(start)+' – '+shortD(end)}
 else{start=new Date(t.getFullYear(),t.getMonth()+pOff,1);n=new Date(start.getFullYear(),start.getMonth()+1,0).getDate();pstart=new Date(start.getFullYear(),start.getMonth()-1,1);pn=new Date(start.getFullYear(),start.getMonth(),0).getDate();label=pOff===0?'This month':MONL[start.getMonth()]+' '+start.getFullYear()}
 const mk=(s,c)=>[...Array(c)].map((_,i)=>dk(addDays(s,i)));
 return{keys:mk(start,n),prev:mk(pstart,pn),label};
}
function workStreak(){let d=new Date();if(!day(dk(d)).w)d=addDays(d,-1);let n=0;while(day(dk(d)).w){n++;d=addDays(d,-1)}return n}
function sinceLast(){
 const ks=Object.keys(S.days).filter(k=>S.days[k].cigs.length).sort();if(!ks.length)return null;
 const k=ks[ks.length-1],c=S.days[k].cigs,known=c.filter(m=>m>=0),m=known.length?Math.max(...known):12*60;
 const at=pd(k);at.setMinutes(m);let mins=Math.max(0,Math.round((Date.now()-at)/60000));
 const d=Math.floor(mins/1440),h=Math.floor(mins%1440/60),mi=mins%60;
 return d?d+'d '+h+'h':h?h+'h '+mi+'m':mi+'m';
}
const pct=(a,b)=>b>0?Math.round((a-b)/b*100):null;
function delta(a,b,lowerGood,unit){const p=pct(a,b);if(p===null||!isFinite(p))return`<span class="kd">${unit}</span>`;if(p===0)return`<span class="kd">Same as ${unit}</span>`;const good=lowerGood?p<0:p>0;return`<span class="kd ${good?'good':'bad'}">${p>0?'▲':'▼'} ${Math.abs(p)}% vs ${unit}</span>`}

/* ---------- views ---------- */
function ring(r,p,c){const C=2*Math.PI*r;let s=`<circle cx="100" cy="100" r="${r}" fill="none" style="stroke:${c}" stroke-opacity=".17" stroke-width="16"/>`;if(p>0)s+=`<circle class="arc" cx="100" cy="100" r="${r}" fill="none" style="stroke:${c}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-Math.min(p,1))).toFixed(2)}" transform="rotate(-90 100 100)"/>`;return s}
function viewToday(){
 const k=cur,d=day(k),st=S.settings,t=todayK(),isT=k===t,dt=pd(k);
 const title=isT?'Today':k===dk(addDays(new Date(),-1))?'Yesterday':DOW[dt.getDay()]+', '+shortD(dt);
 const swimMin=sum(d.swim),cn=d.cigs.length,sp=d.steps/st.stepGoal,wp=d.w?1:0,swp=swimMin/st.swimGoal;
 const known=d.cigs.filter(m=>m>=0).sort((a,b)=>a-b);
 let last='';if(isT&&known.length){const ago=nowMin()-known[known.length-1];last=`Last one at ${tstr(known[known.length-1])} · ${ago>=60?Math.floor(ago/60)+'h '+ago%60+'m':ago+'m'} ago`}
 const lim=st.cigLimit>0?` · limit ${st.cigLimit}`:'';
 const over=st.cigLimit>0&&cn>st.cigLimit;
 return `
 <div class="top"><span class="brand"><span class="dot" id="sdot"></span>Daily Tracker<em id="stext"></em></span>${isT?'':'<button class="pill" data-act="today">Back to today</button>'}</div>
 <div class="datenav">
  <button class="iconbtn" data-act="prev" aria-label="Previous day"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="dlabel"><h1>${esc(title)}</h1><div class="mut small">${DOW[dt.getDay()]}, ${dt.getDate()} ${MONL[dt.getMonth()]} ${dt.getFullYear()} · tap to pick a date</div><input type="date" id="dpick" max="${t}" value="${k}" aria-label="Pick a date"></div>
  <button class="iconbtn" data-act="next" aria-label="Next day" ${isT?'disabled':''}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
 </div>
 <section class="hero">
  <svg viewBox="0 0 200 200" role="img" aria-label="Today's rings">${ring(88,sp,'var(--steps)')}${ring(68,wp,'var(--work)')}${ring(48,swp,'var(--swim)')}
   <text x="100" y="106" text-anchor="middle" font-size="34" font-weight="800" style="fill:${over?'var(--work)':'var(--ink)'}">${cn}</text>
   <text x="100" y="126" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:var(--mut)">${cn===1?'cigarette':'cigarettes'}</text></svg>
  <div class="legend">
   <div class="lg" style="--c:var(--steps)"><i></i><div><b>${fmt(d.steps)}</b><span>of ${fmt(st.stepGoal)} steps</span></div></div>
   <div class="lg" style="--c:var(--work)"><i></i><div><b>${d.w?'Done':'Not yet'}</b><span>workout</span></div></div>
   <div class="lg" style="--c:var(--swim)"><i></i><div><b>${swimMin} min</b><span>of ${st.swimGoal} min swim</span></div></div>
   <div class="lg" style="--c:var(--smoke)"><i></i><div><b>${cn===0?'Smoke-free':cn+' · ₹'+fmt(cn*st.cigPrice)}</b><span>${cn===0?'no cigarettes logged':'spent on cigarettes'}</span></div></div>
  </div>
 </section>

 <section class="card">
  <div class="ch"><span class="ic" style="--c:var(--work)">${IC.work}</span><h2>Workout</h2></div>
  <button class="toggle ${d.w?'on':''}" data-act="work" aria-pressed="${!!d.w}">${d.w?'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Workout done':'Tap when you finish your workout'}</button>
 </section>

 <section class="card" style="--c:var(--steps)">
  <div class="ch"><span class="ic" style="--c:var(--steps)">${IC.steps}</span><h2>Steps</h2><span class="val">${Math.round(Math.min(sp,9.99)*100)}%</span></div>
  <form class="row" id="stepsForm"><input class="inp" id="stepsIn" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Total steps today" value="${d.steps||''}" aria-label="Total steps"><button class="btn" type="submit">Save</button></form>
  <div class="chips">${[500,1000,2500,5000].map(v=>`<button class="chip" data-act="addSteps" data-v="${v}">+${fmt(v)}</button>`).join('')}</div>
  <div class="meter"><i style="width:${Math.min(sp,1)*100}%"></i></div>
  <p class="note">${d.steps>=st.stepGoal?'Goal reached. Great walking!':fmt(st.stepGoal-d.steps)+' steps to go'} · type the total from the iPhone Health app</p>
 </section>

 <section class="card" style="--c:var(--swim)">
  <div class="ch"><span class="ic" style="--c:var(--swim)">${IC.swim}</span><h2>Swimming</h2><span class="val">${swimMin} min</span></div>
  <div class="mut small" style="margin-top:-6px">Add a session</div>
  <div class="chips" style="margin-top:6px">${[15,20,30,45,60].map(v=>`<button class="chip" data-act="swim" data-v="${v}">${v} min</button>`).join('')}</div>
  <form class="row" id="swimForm" style="margin-top:10px"><input class="inp" id="swimIn" inputmode="numeric" pattern="[0-9]*" placeholder="Other minutes" aria-label="Swim minutes" style="font-size:17px"><button class="btn" type="submit">Add</button></form>
  ${d.swim.length?`<div class="chips">${d.swim.map((m,i)=>`<button class="chip x" data-act="swimDel" data-v="${i}" aria-label="Remove session ${i+1}">Session ${i+1} · ${m} min <span aria-hidden="true">✕</span></button>`).join('')}</div>`:''}
  <div class="meter"><i style="width:${Math.min(swp,1)*100}%"></i></div>
 </section>

 <section class="card">
  <div class="ch"><span class="ic" style="--c:var(--smoke)">${IC.smoke}</span><h2>Smoking</h2><span class="val">${cn===0?'Smoke-free':'₹'+fmt(cn*st.cigPrice)}</span></div>
  <div class="smoke">
   <button class="plus" data-act="cig">+1 cigarette<small>${isT?'tap each time you smoke':'adds one to this day'}</small></button>
   <div class="side"><div class="count"><div><b style="${over?'color:var(--work)':''}">${cn}</b><br><span>${isT?'today':'this day'}${lim}</span></div></div><button data-act="cigUndo" ${cn?'':'disabled'} aria-label="Remove one cigarette">−1</button></div>
  </div>
  ${last?`<p class="note">${last}</p>`:''}
  ${known.length?`<div class="times">${known.map(m=>`<span>${tstr(m)}</span>`).join('')}</div>`:''}
  ${over?`<p class="note" style="color:var(--work);font-weight:700">Over your daily limit by ${cn-st.cigLimit}.</p>`:''}
 </section>`;
}
function viewProgress(){
 const st=S.settings,R=range(),a=stats(R.keys),b=stats(R.prev),t=todayK(),n=R.keys.length,u=period==='week'?'last week':'last month';
 const fut=R.keys.map(k=>k>t);
 const lab=R.keys.map(k=>{const d=pd(k);return period==='week'?DOW[d.getDay()].slice(0,1)+DOW[d.getDay()].slice(1,2):String(d.getDate())});
 const showL=period==='week'?()=>true:(i,W)=>(i+1)===1||((i+1)%(W<420?7:5)===0);
 const sl=sinceLast();const ws=workStreak();
 const ins=[];
 if(a.lg.length){
  if(a.cigs===0)ins.push(`No cigarettes logged ${period==='week'?'this week':'this month'} across ${a.lg.length} logged ${a.lg.length===1?'day':'days'}. Keep it going.`);
  else{const p=pct(a.cigAvg,b.cigAvg);ins.push(p===null?`${a.cigs} cigarettes so far, ${a.cigAvg.toFixed(1)} a day on logged days (₹${fmt(a.spent)}).`:`Cigarettes ${p<=0?'down':'up'} ${Math.abs(p)}% vs ${u}: ${a.cigAvg.toFixed(1)} a day, against ${b.cigAvg.toFixed(1)}.`)}
  const hrs=Array(24).fill(0);a.lg.forEach(k=>day(k).cigs.forEach(m=>{if(m>=0)hrs[Math.floor(m/60)]++}));
  const mh=Math.max(...hrs);if(mh>=2){const h=hrs.indexOf(mh);ins.push(`You smoke most between ${tstr(h*60)} and ${tstr((h+1)%24*60)}. That hour is the one to plan around.`)}
  if(a.stepDays){const best=a.el.reduce((x,k)=>day(k).steps>day(x).steps?k:x,a.el[0]);const bd=pd(best);ins.push(`Step goal hit on ${a.goalHit} of ${a.stepDays} logged days. Best day: ${DOW[bd.getDay()]} ${shortD(bd)} with ${fmt(day(best).steps)} steps.`)}
  ins.push(`Worked out on ${a.work} of ${a.el.length} days${a.swimSes?` and swam ${a.swimSes} ${a.swimSes===1?'time':'times'} (${a.swimMin} min)`:''}.`);
 }
 const hrs=Array(24).fill(0);a.lg.forEach(k=>day(k).cigs.forEach(m=>{if(m>=0)hrs[Math.floor(m/60)]++}));
 const rows=[['Workout','var(--work)',k=>day(k).w],['Steps goal','var(--steps)',k=>day(k).steps>=st.stepGoal],['Swim','var(--swim)',k=>day(k).swim.length>0],['Smoke-free','var(--smoke)',k=>has(k)&&!day(k).cigs.length]];
 const grid=`<div class="grid" style="grid-template-columns:max-content repeat(${n},minmax(0,1fr))">${rows.map(([l,c,f])=>`<span class="rl">${l}</span>`+R.keys.map(k=>k>t?'<i class="c fut"></i>':`<i class="c ${f(k)?'on':''}" style="--c:${c}"></i>`).join('')).join('')}<span></span>${R.keys.map((k,i)=>`<span class="dl">${period==='week'||[0,6,13,20,27].includes(i)?esc(lab[i]):''}</span>`).join('')}</div>`;
 const logKeys=a.el.slice().reverse();
 return `
 <div class="top"><span class="brand"><span class="dot" id="sdot"></span>Progress<em id="stext"></em></span></div>
 <div class="seg" role="tablist"><button class="${period==='week'?'on':''}" data-act="period" data-v="week">Week</button><button class="${period==='month'?'on':''}" data-act="period" data-v="month">Month</button></div>
 <div class="pnav"><button class="iconbtn" data-act="pPrev" aria-label="Previous period"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>${esc(R.label)}</h2><button class="iconbtn" data-act="pNext" aria-label="Next period" ${pOff>=0?'disabled':''}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
 <div class="streaks">
  <div class="streak" style="--c:var(--work)"><b>${ws} ${ws===1?'day':'days'}</b><span>workout streak</span></div>
  <div class="streak sm" style="--c:var(--smoke)"><b>${sl?esc(sl):'—'}</b><span>since last cigarette</span></div>
 </div>
 ${a.el.length?'':'<div class="card empty">This period has not started yet.</div>'}
 <div class="kpis">
  <div class="kpi"><span class="kl" style="--c:var(--work)"><i></i>Workouts</span><b>${a.work}/${a.el.length||n}</b>${delta(a.work,b.work,false,u)}</div>
  <div class="kpi"><span class="kl" style="--c:var(--steps)"><i></i>Avg steps / day</span><b>${fmt(a.stepsAvg)}</b>${delta(a.stepsAvg,b.stepsAvg,false,u)}</div>
  <div class="kpi"><span class="kl" style="--c:var(--swim)"><i></i>Swim time</span><b>${a.swimMin} min</b>${delta(a.swimMin,b.swimMin,false,u)}</div>
  <div class="kpi"><span class="kl" style="--c:var(--smoke)"><i></i>Cigarettes</span><b>${a.cigs}</b>${delta(a.cigAvg,b.cigAvg,true,u)}</div>
  <div class="kpi"><span class="kl" style="--c:var(--smoke)"><i></i>Smoke-free days</span><b>${a.sf}/${a.lg.length}</b><span class="kd">of logged days</span></div>
  <div class="kpi"><span class="kl" style="--c:var(--smoke)"><i></i>Spent on smoking</span><b>₹${fmt(a.spent)}</b><span class="kd">at ₹${fmt(st.cigPrice)} each</span></div>
 </div>
 <section class="card"><h3>Consistency</h3><p class="sub">Filled squares are days you hit it</p>${grid}</section>
 ${ins.length?`<section class="card"><h3>What the numbers say</h3><p class="sub">${esc(R.label)}</p><ul class="ins">${ins.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}
 <section class="card"><h3>Steps per day</h3><p class="sub">Dashed line is your ${fmt(st.stepGoal)} goal; faded bars missed it</p><div class="fig" id="fSteps"></div></section>
 <section class="card"><h3>Cigarettes per day</h3><p class="sub">${st.cigLimit?'Dashed line is your daily limit':'Lower is better'}</p><div class="fig" id="fCigs"></div></section>
 <section class="card"><h3>Swimming minutes</h3><p class="sub">Total minutes in the pool each day</p><div class="fig" id="fSwim" style="height:140px"></div></section>
 ${sum(hrs)?`<section class="card"><h3>When you smoke</h3><p class="sub">Cigarettes by hour of day, ${esc(R.label.toLowerCase())}</p><div class="fig" id="fHour" style="height:140px"></div></section>`:''}
 <section class="card"><h3>Daily log</h3><p class="sub">Tap a day to edit it</p>
 ${logKeys.length?`<table><thead><tr><th>Day</th><th>Workout</th><th>Steps</th><th>Swim</th><th>Cigs</th></tr></thead><tbody>${logKeys.map(k=>{const d=day(k),dd=pd(k);return`<tr class="go" data-act="open" data-v="${k}"><td><b>${DOW[dd.getDay()]}</b> ${shortD(dd)}</td><td>${d.w?'<span class="yes">✓</span>':'<span class="mut">–</span>'}</td><td>${d.steps?fmt(d.steps):'<span class="mut">–</span>'}</td><td>${d.swim.length?sum(d.swim)+'m':'<span class="mut">–</span>'}</td><td>${has(k)?d.cigs.length:'<span class="mut">–</span>'}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Nothing to show yet.</div>'}
 </section>`;
}
function viewSetup(){
 const st=S.settings;
 return `
 <div class="top"><span class="brand"><span class="dot" id="sdot"></span>Settings<em id="stext"></em></span></div>
 <section class="card"><h3 style="margin-bottom:12px">Goals</h3>
  <div class="field"><label for="sg">Daily step goal</label><input class="inp" id="sg" data-set="stepGoal" inputmode="numeric" pattern="[0-9]*" value="${st.stepGoal}"></div>
  <div class="field"><label for="wg">Daily swim goal (minutes)</label><input class="inp" id="wg" data-set="swimGoal" inputmode="numeric" pattern="[0-9]*" value="${st.swimGoal}"></div>
  <div class="field"><label for="cp">Price per cigarette (₹)</label><input class="inp" id="cp" data-set="cigPrice" inputmode="decimal" value="${st.cigPrice}"></div>
  <div class="field" style="margin:0"><label for="cl">Daily cigarette limit (0 = off)</label><input class="inp" id="cl" data-set="cigLimit" inputmode="numeric" pattern="[0-9]*" value="${st.cigLimit}"></div>
 </section>
 <section class="card"><h3>Your data</h3><p class="sub">Everything is saved on this phone only, no account needed. Copy a backup to Notes now and then.</p>
  <div class="row" style="flex-wrap:wrap"><button class="btn ghost" data-act="copy">Copy backup</button><button class="btn ${eraseArm?'danger':'ghost'}" data-act="erase">${eraseArm?'Tap again to erase everything':'Erase all data'}</button></div>
  <div class="field" style="margin:14px 0 0"><label for="rest">Restore from a backup</label><textarea class="inp" id="rest" placeholder="Paste a copied backup here"></textarea><button class="btn" data-act="restore" style="margin-top:4px">Restore</button></div>
 </section>
 <section class="card"><h3>Put it on your home screen</h3><ol class="steps-list" style="margin-top:8px"><li>Open this page in Safari.</li><li>Tap the Share button.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol><p class="note">Steps come from the iPhone Health app: open Health, check today's step count and type it in.</p></section>`;
}
function render(){
 ro.disconnect();figs.clear();
 const app=$('#app');app.innerHTML=tab==='today'?viewToday():tab==='progress'?viewProgress():viewSetup();
 ['today','progress','setup'].forEach(x=>$('#t-'+x).classList.toggle('on',x===tab));
 setSync(syncState);
 if(tab==='progress'){
  const st=S.settings,R=range(),t=todayK(),fut=R.keys.map(k=>k>t),a=stats(R.keys);
  const lab=R.keys.map(k=>{const d=pd(k);return period==='week'?DOW[d.getDay()]:String(d.getDate())});
  const show=period==='week'?()=>true:(i,W)=>i===0||((i+1)%(W<420?7:5)===0);
  chart('fSteps',R.keys.map(k=>day(k).steps),lab,{color:'var(--steps)',goal:st.stepGoal,goodAbove:true,goalLabel:'goal',future:fut,show,aria:'Steps per day',min:1000});
  chart('fCigs',R.keys.map(k=>day(k).cigs.length),lab,{color:'var(--smoke)',goal:st.cigLimit||0,goalLabel:'limit',future:fut,show,aria:'Cigarettes per day',min:4});
  chart('fSwim',R.keys.map(k=>sum(day(k).swim)),lab,{color:'var(--swim)',future:fut,show,aria:'Swim minutes per day',min:30});
  const hrs=Array(24).fill(0);a.lg.forEach(k=>day(k).cigs.forEach(m=>{if(m>=0)hrs[Math.floor(m/60)]++}));
  chart('fHour',hrs,[...Array(24)].map((_,h)=>h===0?'12a':h===12?'12p':h<12?h+'a':(h-12)+'p'),{color:'var(--smoke)',show:i=>i%6===0,aria:'Cigarettes by hour',min:2});
 }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act,v=b.dataset.v,k=cur;
 if(a!=='erase')eraseArm=false;
 switch(a){
  case 'tab':tab=v;render();window.scrollTo(0,0);break;
  case 'prev':cur=dk(addDays(pd(cur),-1));render();break;
  case 'next':if(cur<todayK()){cur=dk(addDays(pd(cur),1));render()}break;
  case 'today':cur=todayK();render();break;
  case 'work':{const was=day(k).w;edit(k,d=>{d.w=was?0:1},was?'Workout unmarked':'Workout logged');break}
  case 'addSteps':edit(k,d=>{d.steps=(d.steps||0)+(+v)},'+'+fmt(+v)+' steps');break;
  case 'swim':edit(k,d=>{d.swim.push(+v)},'Swim · '+v+' min added');break;
  case 'swimDel':edit(k,d=>{d.swim.splice(+v,1)},'Session removed');break;
  case 'cig':edit(k,d=>{d.cigs.push(k===todayK()?nowMin():-1)},'Cigarette logged');break;
  case 'cigUndo':if(day(k).cigs.length)edit(k,d=>{d.cigs.pop()},'Removed one');break;
  case 'undo':doUndo();$('#toast').classList.remove('show');break;
  case 'period':period=v;pOff=0;render();break;
  case 'pPrev':pOff--;render();break;
  case 'pNext':if(pOff<0){pOff++;render()}break;
  case 'open':cur=v;tab='today';render();window.scrollTo(0,0);break;
  case 'copy':{const txt=JSON.stringify({app:'daily-tracker',v:1,settings:S.settings,days:S.days});
   navigator.clipboard.writeText(txt).then(()=>toast('Backup copied. Paste it in Notes',false)).catch(()=>{const r=$('#rest');if(r){r.value=txt;r.select()}toast('Select the text below and copy it',false)});break}
  case 'restore':{try{const r=JSON.parse($('#rest').value);if(!r||typeof r.days!=='object')throw 0;const now=Date.now();
   for(const dkk in r.days){if(!/^\d{4}-\d\d-\d\d$/.test(dkk))continue;const c=clean(r.days[dkk]);c.u=now;S.days[dkk]=c;dirty.add(dkk.slice(0,7))}
   if(r.settings){for(const x of ['stepGoal','swimGoal','cigPrice','cigLimit'])if(Number.isFinite(+r.settings[x]))S.settings[x]=+r.settings[x];S.settings.su=now;dirtySet=true}
   persist();queue();render();toast('Backup restored',false)}catch(err){toast('That backup could not be read',false)}break}
  case 'erase':if(!eraseArm){eraseArm=true;render()}else{eraseArm=false;const now=Date.now();for(const x in S.days)dirty.add(x.slice(0,7));S.days={};S.settings.erasedAt=now;S.settings.su=now;dirtySet=true;persist();queue();render();toast('All data erased',false)}break;
 }
});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='stepsForm'){saveSteps();document.activeElement&&document.activeElement.blur()}
 if(e.target.id==='swimForm'){const n=parseInt($('#swimIn').value,10);if(n>0&&n<=600)edit(cur,d=>{d.swim.push(n)},'Swim · '+n+' min added');else toast('Enter minutes between 1 and 600',false)}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='stepsIn')saveSteps();
 else if(el.id==='dpick'){if(el.value&&el.value<=todayK()){cur=el.value;render()}}
 else if(el.dataset&&el.dataset.set){const key=el.dataset.set,n=parseFloat(el.value);
  const lim={stepGoal:[500,100000],swimGoal:[5,600],cigPrice:[0,10000],cigLimit:[0,100]}[key];
  if(!Number.isFinite(n)||n<lim[0]||n>lim[1]){toast('Enter a number from '+lim[0]+' to '+fmt(lim[1]),false);el.value=S.settings[key];return}
  setSetting(key,key==='cigPrice'?Math.round(n*100)/100:Math.round(n))}
});
setInterval(()=>{const f=document.activeElement;if(tab==='today'&&cur===todayK()&&document.visibilityState==='visible'&&!(f&&/INPUT|TEXTAREA/.test(f.tagName)))render()},60000);
render();
}
</script>
</body>
</html>
